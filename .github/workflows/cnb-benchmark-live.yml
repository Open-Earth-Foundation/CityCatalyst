name: CNB live benchmark (advisory)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnb-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    # Keep this check non-required in branch protection. Quality failures
    # remain visible; continue-on-error would hide a broken evaluation pipeline.
    name: CNB quality report (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Initialize failure evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cnb-evidence"
          printf '%s\n' '{"execution":"unavailable","reason":"Setup or credentials unavailable"}' > "$RUNNER_TEMP/cnb-evidence/status.json"
          printf '%s\n' '# CNB live benchmark' '' 'Evaluation unavailable: setup did not complete.' > "$RUNNER_TEMP/cnb-evidence/summary.md"

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout trusted baseline
        uses: actions/checkout@v4
        with:
          ref: develop
          path: .cnb-base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: climate-advisor/uv.lock

      - name: Install benchmark dependencies
        working-directory: climate-advisor
        run: uv sync --locked

      - name: Run benchmark
        id: benchmark
        working-directory: climate-advisor
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CA_DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          # Service tracing stays off; --mlflow uploads the finished run to Clima-CNB-Benchmark.
          MLFLOW_ENABLED: 'false'
          MLFLOW_TRACKING_URI: https://mlflow-dev.openearth.dev
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          CC_BASE_URL: http://localhost:3000
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            printf '%s\n' '# CNB live benchmark' '' 'Evaluation unavailable: OPENROUTER_API_KEY is missing.' > "$RUNNER_TEMP/cnb-evidence/summary.md"
            echo 'status=3' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          # Three fixtures run serially; a saved run took about 2,150 seconds.
          uv run python -m benchmark.cnb.scripts.evaluate \
            --run-id "$RUN_ID" --label "$RUN_ID" --timeout-seconds 3600 --mlflow \
            --results-dir output/cnb-ci \
            --baseline-manifest ../.cnb-base/climate-advisor/benchmark/cnb/baseline.json \
            --baseline-results-dir ../.cnb-base/climate-advisor/benchmark/cnb/results || status=$?
          : > "$RUNNER_TEMP/cnb-evidence/summary.md"
          summary="output/cnb-ci/runs/$RUN_ID/comparison.md"
          if [[ -f "$summary" ]]; then cat "$summary" >> "$RUNNER_TEMP/cnb-evidence/summary.md"; fi
          printf '{"execution":"finished","exit_code":%s}\n' "$status" > "$RUNNER_TEMP/cnb-evidence/status.json"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload review bundle and partial evidence
        id: review_artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnb-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            climate-advisor/output/cnb-ci/
            ${{ runner.temp }}/cnb-evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Publish review summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.review_artifacts.outputs.artifact-url }}
        run: |
          printf 'Download [review bundle and partial evidence](%s). Extract review-bundle.zip and open index.html; evidence links below work inside that bundle.\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cnb-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve advisory failure status
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.benchmark.outputs.status || '3' }}
        run: exit "$RESULT"
