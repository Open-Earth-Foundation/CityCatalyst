# CNB migration job for the development database.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: climate-advisor-cnb-migrate-dev-
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: climate-advisor-cnb-migrate
          image: ghcr.io/open-earth-foundation/citycatalyst-climate-advisor:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: climate-advisor-db-configmap-dev
          command: ["alembic", "-c", "cnb-alembic.ini", "upgrade", "head"]
