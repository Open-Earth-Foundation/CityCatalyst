[pytest]
# Offline benchmark tests (no model calls). From climate-advisor/:
#   uv run pytest benchmark/tests
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# climate-advisor/ for `benchmark`, service/ for the production `app` it drives.
pythonpath =
    ..
    ../service
addopts =
    --strict-markers
    --tb=short
