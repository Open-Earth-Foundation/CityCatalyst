name: Platform Contracts

# Fails when a change breaks the frozen public API contract published in
# Open-Earth-Foundation/platform-contracts. See its POLICY.md for what counts
# as breaking and how to deprecate. To adopt a new contract release, bump
# CONTRACTS_VERSION.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/src/app/api/**
      - app/scripts/build-swagger-doc.ts
      - app/package.json
      - .github/workflows/platform-contracts.yml
  push:
    branches: [develop, main]
    paths:
      - app/src/app/api/**
      - app/scripts/build-swagger-doc.ts
      - .github/workflows/platform-contracts.yml

env:
  CONTRACTS_VERSION: v1.0.1
  OASDIFF_VERSION: "1.34.1"

jobs:
  openapi-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out platform-contracts ${{ env.CONTRACTS_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: Open-Earth-Foundation/platform-contracts
          ref: ${{ env.CONTRACTS_VERSION }}
          path: platform-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Generate OpenAPI spec
        working-directory: app
        run: npm run openapi:build

      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin oasdiff

      - name: Check for breaking changes against the frozen contract
        run: platform-contracts/scripts/check-openapi.sh app/public/openapi-spec.json
