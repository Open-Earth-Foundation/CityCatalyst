openapi: 3.0.3
info:
  title: Climate Advisor Service API
  version: 0.1.0
  description: |
    API for the Climate Advisor microservice. Provides health checks and chat endpoints.

    `POST /v1/threads` and `POST /v1/messages` require a CityCatalyst user bearer.
    Climate Advisor validates it at Core identity before any write. Core's canonical
    user ID must equal body `user_id`. Missing, malformed, rejected, or subject-mismatched
    credentials return HTTP 401 and persist nothing. Core identity unavailability
    returns HTTP 503 and persists nothing.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /v1/threads:
    post:
      summary: Create thread
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
      responses:
        '201':
          description: Thread created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadCreateResponse'
        '401':
          $ref: '#/components/responses/WriteAuthFailed'
        '503':
          $ref: '#/components/responses/WriteAuthUnavailable'
        '422':
          description: Validation error
  /v1/messages:
    post:
      summary: Send a message (streams SSE)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '200':
          description: SSE stream of assistant tokens
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/WriteAuthFailed'
        '503':
          $ref: '#/components/responses/WriteAuthUnavailable'
        '422':
          description: Validation error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CityCatalyst user token validated at Core `/api/v1/internal/ca/auth/identity` before any write.
  responses:
    WriteAuthFailed:
      description: Missing, malformed, rejected, expired, or subject-mismatched bearer. Nothing is persisted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: CityCatalyst authentication failed
            status: 401
            detail: CityCatalyst authentication failed
    WriteAuthUnavailable:
      description: Core identity validation is unavailable. Nothing is persisted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: CityCatalyst identity service is unavailable
            status: 503
            detail: CityCatalyst identity service is unavailable
  schemas:
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
    ThreadCreateRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        inventory_id:
          type: string
          nullable: true
        context:
          nullable: true
          oneOf:
            - type: object
            - type: string
    ThreadCreateResponse:
      type: object
      required: [thread_id]
      properties:
        thread_id:
          type: string
        inventory_id:
          type: string
          nullable: true
        context:
          nullable: true
    MessageCreateRequest:
      type: object
      required: [user_id, content]
      properties:
        user_id:
          type: string
        content:
          type: string
        thread_id:
          type: string
          nullable: true
        inventory_id:
          type: string
          nullable: true
        context:
          nullable: true
        options:
          type: object
          nullable: true
          properties:
            model:
              type: string
            temperature:
              type: number
            max_tokens:
              type: integer
